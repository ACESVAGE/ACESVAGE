name: Autonomous Profile README Sync

on:
  schedule:
    # Run automatically every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [repo-updated, companion-update]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Profile Synchronizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_profile.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore(sync): autonomously update profile README with latest repo status [skip ci]"
            git push
          else
            echo "Profile README is already up to date."
          fi
