<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250" role="img" aria-label="ACESVAGE SOC Terminal">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #1f2937; stroke-width: 1.5; }
      .bar { fill: #161b22; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 12px; }
      .title { fill: #8b949e; font-size: 11px; font-weight: 600; }
      .prompt { fill: #00ff88; font-weight: 700; }
      .cmd { fill: #e6edf3; }
      .cyan { fill: #00bfff; }
      .muted { fill: #8b949e; }
      .ok { fill: #00ff88; }
      .warn { fill: #ffbd2e; }
      .cursor { fill: #00bfff; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fadeLine {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      .c-blink { animation: blink 1s infinite; }
      .l1 { opacity: 0; animation: fadeLine 0.3s ease forwards 0.2s; }
      .l2 { opacity: 0; animation: fadeLine 0.3s ease forwards 0.7s; }
      .l3 { opacity: 0; animation: fadeLine 0.3s ease forwards 1.2s; }
      .l4 { opacity: 0; animation: fadeLine 0.3s ease forwards 1.7s; }
      .l5 { opacity: 0; animation: fadeLine 0.3s ease forwards 2.2s; }
      .l6 { opacity: 0; animation: fadeLine 0.3s ease forwards 2.7s; }
      .l7 { opacity: 0; animation: fadeLine 0.3s ease forwards 3.2s; }
    </style>
  </defs>

  <!-- Terminal Window -->
  <rect class="bg" x="1" y="1" width="418" height="248" rx="10" />
  <path class="bar" d="M 1 11 Q 1 1 11 1 L 409 1 Q 419 1 419 11 L 419 32 L 1 32 Z" />
  <line x1="1" y1="32" x2="419" y2="32" stroke="#1f2937" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="18" cy="16" r="5" fill="#ff5f56" />
  <circle cx="36" cy="16" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="16" r="5" fill="#27c93f" />
  <text class="mono title" x="145" y="20">acesvage@soc-lab:~</text>

  <!-- Terminal Lines -->
  <g class="mono l1">
    <text x="16" y="56"><tspan class="prompt">└─$ </tspan><tspan class="cmd">./status.sh --blue-team</tspan></text>
  </g>
  <g class="mono l2">
    <text x="16" y="80"><tspan class="cyan">[+]</tspan><tspan class="muted"> operator : </tspan><tspan class="cmd">ACESVAGE</tspan></text>
  </g>
  <g class="mono l3">
    <text x="16" y="102"><tspan class="cyan">[+]</tspan><tspan class="muted"> track    : </tspan><tspan class="cmd">SOC / Threat Hunting</tspan></text>
  </g>
  <g class="mono l4">
    <text x="16" y="124"><tspan class="ok">[✓]</tspan><tspan class="muted"> certs    : </tspan><tspan class="cmd">IBM · Cisco · RH124</tspan></text>
  </g>
  <g class="mono l5">
    <text x="16" y="146"><tspan class="warn">[~]</tspan><tspan class="muted"> training : </tspan><tspan class="cmd">THM Pre-Security (active)</tspan></text>
  </g>
  <g class="mono l6">
    <text x="16" y="172"><tspan class="cyan">[i]</tspan><tspan class="muted"> arsenal  : </tspan><tspan class="ok">py-sec (7/30) · linux (5/30) · c (1/20)</tspan></text>
  </g>
  <g class="mono l7">
    <text x="16" y="206"><tspan class="prompt">└─$ </tspan><tspan class="cmd">_</tspan></text>
    <rect class="cursor c-blink" x="45" y="195" width="8" height="14" rx="1" />
  </g>
</svg>
